name: Deploy PM Tool

on:
  push:
    branches:
      - claude/saas-project-management-design-BsbSY

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          FRONTEND_URL_ALT: ${{ secrets.FRONTEND_URL_ALT }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DATABASE_URL,DIRECT_URL,JWT_SECRET,FRONTEND_URL,FRONTEND_URL_ALT,BACKEND_URL,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASS,EMAIL_FROM
          script: |
            set -e
            APP_DIR=~/pmttest/Project-Management-tool

            # ── 1. Pull latest code ──────────────────────────────────────────
            cd "$APP_DIR"
            git fetch origin
            git reset --hard origin/claude/saas-project-management-design-BsbSY

            # ── 2. Write backend .env from GitHub Secrets ────────────────────
            printf '%s\n' \
              "NODE_ENV=production" \
              "PORT=4000" \
              "DATABASE_URL=${DATABASE_URL}" \
              "DIRECT_URL=${DIRECT_URL}" \
              "JWT_SECRET=${JWT_SECRET}" \
              "JWT_EXPIRES_IN=15m" \
              "REFRESH_TOKEN_EXPIRES_IN=7d" \
              "FRONTEND_URL=${FRONTEND_URL}" \
              "FRONTEND_URL_ALT=${FRONTEND_URL_ALT}" \
              "BACKEND_URL=${BACKEND_URL}" \
              "SMTP_HOST=${SMTP_HOST}" \
              "SMTP_PORT=${SMTP_PORT:-587}" \
              "SMTP_USER=${SMTP_USER}" \
              "SMTP_PASS=${SMTP_PASS}" \
              "EMAIL_FROM=${EMAIL_FROM}" \
              > "$APP_DIR/backend/.env"

            # ── 3. Validate required secrets before proceeding ───────────────
            echo "=== .env verification ==="
            MISSING=0
            for VAR in DATABASE_URL JWT_SECRET FRONTEND_URL; do
              VAL=$(grep "^${VAR}=" "$APP_DIR/backend/.env" | cut -d= -f2-)
              if [ -z "$VAL" ]; then
                echo "ERROR: $VAR is empty — add it in GitHub Settings → Secrets → Actions"
                MISSING=1
              else
                echo "$VAR = [set, ${#VAL} chars]"
              fi
            done

            # JWT_SECRET must be >= 32 chars (enforced by config/index.js in production)
            JWT_LEN=$(grep "^JWT_SECRET=" "$APP_DIR/backend/.env" | cut -d= -f2- | wc -c)
            if [ "$JWT_LEN" -lt 33 ]; then
              echo "ERROR: JWT_SECRET is only ${JWT_LEN} chars — must be at least 32 characters"
              MISSING=1
            fi

            if [ "$MISSING" -eq 1 ]; then exit 1; fi
            echo "All required secrets present"

            # ── 4. Install deps ──────────────────────────────────────────────
            cd "$APP_DIR/backend"
            npm install --omit=dev

            # ── 5. DB migrations + seed ──────────────────────────────────────
            npx prisma migrate deploy
            npx prisma db seed

            # ── 6. Restart backend cleanly so dotenv picks up the new .env ───
            # pm2 reload --update-env reads from the shell, not from .env file.
            # Delete + start ensures the fresh process loads .env via dotenv.config()
            echo "=== Restarting backend ==="
            pm2 delete qflow-backend 2>/dev/null || true
            pm2 start src/app.js --name qflow-backend
            pm2 save

            # ── 7. Health check — surface crash reason in the Actions log ────
            echo "=== Waiting 15s for backend to initialise ==="
            sleep 15
            if curl -sf http://localhost:4000/health; then
              echo ""
              echo "Backend health check PASSED"
            else
              echo "ERROR: Backend health check FAILED — PM2 logs:"
              pm2 logs qflow-backend --lines 80 --nostream
              pm2 status
              exit 1
            fi

            # ── 8. Build & deploy frontend ───────────────────────────────────
            cd "$APP_DIR/frontend"
            npm install
            npm run build
            sudo cp -r dist/* /var/www/html/

            echo "=== Deploy complete ==="
