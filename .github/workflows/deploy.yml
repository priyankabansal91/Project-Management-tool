name: Deploy PM Tool

on:
  push:
    branches:
      - claude/saas-project-management-design-BsbSY

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          FRONTEND_URL_ALT: ${{ secrets.FRONTEND_URL_ALT }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DATABASE_URL,DIRECT_URL,JWT_SECRET,FRONTEND_URL,FRONTEND_URL_ALT,BACKEND_URL,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASS,EMAIL_FROM
          script: |
            set -e
            APP_DIR=~/pmttest/Project-Management-tool

            # ── 1. Pull latest code ──────────────────────────────────────────
            cd "$APP_DIR"
            git fetch origin
            git reset --hard origin/claude/saas-project-management-design-BsbSY

            # ── 2. Write backend .env from GitHub Secrets ────────────────────
            printf '%s\n' \
              "NODE_ENV=production" \
              "PORT=4000" \
              "DATABASE_URL=${DATABASE_URL}" \
              "DIRECT_URL=${DIRECT_URL}" \
              "JWT_SECRET=${JWT_SECRET}" \
              "JWT_EXPIRES_IN=15m" \
              "REFRESH_TOKEN_EXPIRES_IN=7d" \
              "FRONTEND_URL=${FRONTEND_URL}" \
              "FRONTEND_URL_ALT=${FRONTEND_URL_ALT}" \
              "BACKEND_URL=${BACKEND_URL}" \
              "SMTP_HOST=${SMTP_HOST}" \
              "SMTP_PORT=${SMTP_PORT:-587}" \
              "SMTP_USER=${SMTP_USER}" \
              "SMTP_PASS=${SMTP_PASS}" \
              "EMAIL_FROM=${EMAIL_FROM}" \
              > "$APP_DIR/backend/.env"

            # Verify key vars are non-empty before proceeding
            echo "=== .env verification ==="
            for VAR in DATABASE_URL JWT_SECRET FRONTEND_URL; do
              VAL=$(grep "^${VAR}=" "$APP_DIR/backend/.env" | cut -d= -f2-)
              if [ -z "$VAL" ]; then
                echo "ERROR: $VAR is empty — check GitHub Secrets"
                exit 1
              else
                echo "$VAR = [set, ${#VAL} chars]"
              fi
            done

            # ── 3. Install deps ──────────────────────────────────────────────
            cd "$APP_DIR/backend"
            npm install --omit=dev

            # ── 4. DB migrations + seed ──────────────────────────────────────
            npx prisma migrate deploy
            npx prisma db seed

            # ── 5. Reload backend ────────────────────────────────────────────
            pm2 reload qflow-backend --update-env || pm2 start src/app.js --name qflow-backend

            # ── 6. Health check — show PM2 logs if backend fails to start ────
            echo "=== Waiting 8s for backend to start ==="
            sleep 8
            if curl -sf http://localhost:4000/health > /dev/null 2>&1; then
              echo "Backend health check PASSED"
            else
              echo "ERROR: Backend health check FAILED — dumping PM2 logs:"
              pm2 logs qflow-backend --lines 50 --nostream
              pm2 status
              exit 1
            fi

            # ── 7. Build & deploy frontend ───────────────────────────────────
            cd "$APP_DIR/frontend"
            npm install
            npm run build
            sudo cp -r dist/* /var/www/html/

            echo "=== Deploy complete ==="
