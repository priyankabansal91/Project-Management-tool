name: Deploy PM Tool

on:
  push:
    branches:
      - claude/saas-project-management-design-BsbSY

jobs:
  deploy-backend:
    name: Deploy Backend to Vercel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy backend
        run: |
          cp backend/.vercel/project.json .vercel/project.json
          vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: team_PkCqsJsJYy2R6iYJwGfEAslo
          VERCEL_PROJECT_ID: prj_sa0e0J5tI1f1JmDMuVpNIK8gXitU

  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy frontend
        run: |
          cp frontend/.vercel/project.json .vercel/project.json
          vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: team_PkCqsJsJYy2R6iYJwGfEAslo
          VERCEL_PROJECT_ID: prj_SxIQ8BWkOxA8tt3pauhNsQ4wrBBa
